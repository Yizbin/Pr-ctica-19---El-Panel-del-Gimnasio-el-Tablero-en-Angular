<main class="container">
  <h1>Panel del Gimnasio</h1>

  <section class="resumen-grid">
    <div class="resumen-card">
      <h4>Total Clases</h4>
      <p>{{ totalClases() }}</p>
    </div>
    <div class="resumen-card">
      <h4>Minutos a la Semana</h4>
      <p>{{ minutosTotales() }} min</p>
    </div>
    <div class="resumen-card">
      <h4>Clases ≥ 1 hora</h4>
      <p>{{ clasesLargas() }}</p>
    </div>
  </section>

  <div class="acciones">
    <button (click)="vaciarCatalogo()" class="btn btn-danger">Vaciar Catálogo</button>
    <button (click)="restaurarCatalogo()" class="btn btn-primary">Restaurar Catálogo</button>
  </div>

  <section class="grid-clases">
    @for (clase of clases(); track clase.id) {
      <app-tarjeta-clase [clase]="clase" />
    } @empty {
      <div class="mensaje-vacio">
        <p>No hay clases disponibles en este momento.</p>
      </div>
    }
  </section>
</main>
